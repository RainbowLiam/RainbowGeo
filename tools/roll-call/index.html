<!DOCTYPE html>
<html lang="zh-CN" data-theme="neon">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>课堂点名器 v1.2 · 在线试用版 | RainbowGeo（文波地理）</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.20.2/dist/xlsx.full.min.js">
    </script>
    <style>
        /* ===== 全局重置 & 基础结构 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background 0.3s ease, color 0.2s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-body);
            color: var(--text-primary);
            padding: 20px;
            margin: 0;
            overflow: hidden;
        }

        .container {
            width: 1200px;
            max-width: 100%;
            background: var(--bg-container);
            backdrop-filter: var(--blur-container, none);
            border-radius: var(--radius-container, 48px);
            padding: 28px 32px 24px;
            box-shadow: var(--shadow-container, 0 20px 60px rgba(0, 0, 0, 0.15));
            border: var(--border-container, none);
            position: relative;
            transition: all 0.4s ease;
        }

        /* ===== 走马灯容器 ===== */
        .marquee-container {
            position: absolute;
            top: -34px;
            left: -34px;
            right: -34px;
            bottom: -34px;
            pointer-events: none;
            z-index: 1;
            border-radius: var(--radius-container, 48px);
        }

        .marquee-container .light {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform, box-shadow, opacity;
            transform: translate(-50%, -50%);
            transition: opacity 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease, background 0.1s ease;
        }

        .marquee-container .light {
            opacity: 0.12;
            transform: translate(-50%, -50%) scale(0.8);
        }

        .marquee-container .light.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.15);
        }

        .marquee-container .light.trail {
            opacity: 0.55;
            transform: translate(-50%, -50%) scale(0.92);
        }

        .marquee-container .light.trail2 {
            opacity: 0.25;
            transform: translate(-50%, -50%) scale(0.85);
        }

        .marquee-container .light.all-on {
            opacity: 1 !important;
            transform: translate(-50%, -50%) scale(1.15) !important;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

        .marquee-container .light.flash-on {
            opacity: 1 !important;
            transform: translate(-50%, -50%) scale(1.2) !important;
            transition: opacity 0.05s ease, transform 0.05s ease;
        }

        .marquee-container .light.flash-off {
            opacity: 0.05 !important;
            transform: translate(-50%, -50%) scale(0.6) !important;
            transition: opacity 0.05s ease, transform 0.05s ease;
            box-shadow: none !important;
        }

        /* ===== 左上角版权 ===== */
        .copyright {
            position: absolute;
            top: 6px;
            left: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1.8px;
            background: linear-gradient(90deg,
                    rgba(255, 215, 0, 0.5),
                    rgba(255, 105, 180, 0.5),
                    rgba(0, 191, 255, 0.5),
                    rgba(255, 215, 0, 0.5));
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: copyrightShimmer 4s ease-in-out infinite;
            cursor: pointer;
            user-select: none;
            z-index: 10;
            padding: 0;
            border: none;
            backdrop-filter: none;
            background-color: transparent;
            text-shadow: none;
            transition: none;
        }

        .copyright:hover {
            animation-duration: 1.2s;
            transform: scale(1.08);
        }

        @keyframes copyrightShimmer {
            0% {
                background-position: 0% center;
            }
            50% {
                background-position: 200% center;
            }
            100% {
                background-position: 0% center;
            }
        }

        /* ===== 左下角版本信息 ===== */
        .version-info {
            position: absolute;
            bottom: 10px;
            left: 18px;
            font-size: 0.55rem;
            font-weight: 400;
            color: rgba(255, 255, 0, 0.35);
            background: rgba(0, 0, 0, 0.06);
            padding: 2px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 0, 0.06);
            font-family: 'Courier New', monospace;
            white-space: nowrap;
            z-index: 10;
        }

        /* ===== 版权弹窗 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(40px);
            border-radius: 32px;
            padding: 40px 50px 44px;
            max-width: 480px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: scaleIn 0.35s ease;
            color: var(--text-primary, #222);
        }

        .modal-box .icon {
            font-size: 2.8rem;
            margin-bottom: 8px;
            display: block;
        }

        .modal-box h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f7971e, #ffd200, #f7971e);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s ease-in-out infinite;
        }

        .modal-box .sub {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary, #555);
            margin-bottom: 4px;
            letter-spacing: 1px;
            -webkit-text-fill-color: var(--text-secondary, #555);
        }

        .modal-box .divider {
            width: 60px;
            height: 2px;
            margin: 12px auto;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.5), transparent);
        }

        .modal-box .desc {
            font-size: 0.85rem;
            opacity: 0.7;
            line-height: 1.7;
            margin-bottom: 6px;
            -webkit-text-fill-color: var(--text-primary, #333);
        }

        .modal-box .email {
            font-size: 0.8rem;
            opacity: 0.5;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            -webkit-text-fill-color: var(--text-secondary, #666);
        }

        .modal-box .close-btn {
            margin-top: 20px;
            padding: 8px 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            color: var(--text-primary, #333);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-text-fill-color: var(--text-primary, #333);
        }

        .modal-box .close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.04);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9) translateY(20px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% center;
            }
            50% {
                background-position: 200% center;
            }
        }

        /* ===== 主展示区 ===== */
        .display-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 8px 0 20px;
            min-height: 400px;
            position: relative;
            z-index: 2;
        }

        .side-name {
            flex: 0 0 90px;
            text-align: center;
            font-size: 1rem;
            font-weight: 300;
            opacity: 0.4;
            color: var(--text-secondary, #666);
            letter-spacing: 0.5px;
            padding: 10px 4px;
            background: var(--side-bg, transparent);
            border-radius: var(--radius-card, 20px);
            transition: all 0.3s;
            word-break: break-all;
            line-height: 1.3;
        }

        .side-name .label {
            display: block;
            font-size: 0.55rem;
            opacity: 0.35;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .main-name-wrapper {
            flex: 1;
            text-align: center;
            padding: 8px 12px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .main-name {
            font-size: 9rem;
            font-weight: 800;
            letter-spacing: 8px;
            color: var(--text-main, #222);
            text-shadow: var(--text-glow, none);
            transition: all 0.15s ease;
            line-height: 1.1;
            word-break: break-word;
            background: var(--main-bg, transparent);
            padding: 0.2em 0.6em;
            border-radius: var(--radius-card, 32px);
            border: var(--main-border, none);
            box-shadow: var(--main-shadow, none);
            transform: var(--main-transform, none);
            font-family: var(--main-font, inherit);
            backdrop-filter: var(--main-blur, none);
            min-width: 260px;
            min-height: 160px;
            max-width: 95%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-name .hint {
            font-size: 1.2rem;
            font-weight: 400;
            opacity: 0.2;
            letter-spacing: 3px;
            line-height: 1.6;
        }

        /* ===== 状态栏 ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            opacity: 0.35;
            padding: 2px 8px;
            margin-bottom: 4px;
            flex-wrap: wrap;
            gap: 6px;
            position: relative;
            z-index: 2;
        }

        /* ===== 控制按钮行 ===== */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 8px;
            margin-bottom: 14px;
            position: relative;
            z-index: 2;
        }

        .controls button {
            padding: 12px 32px;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 60px;
            background: var(--btn-bg, #eaeef2);
            color: var(--btn-text, #222);
            cursor: pointer;
            box-shadow: var(--btn-shadow, 0 4px 12px rgba(0, 0, 0, 0.06));
            transition: all 0.2s;
            letter-spacing: 0.5px;
            backdrop-filter: var(--btn-blur, none);
            border: var(--btn-border, none);
            flex: 0 1 auto;
            min-width: 90px;
        }

        .controls button:hover {
            transform: translateY(-3px) scale(1.02);
            filter: brightness(1.08);
            box-shadow: var(--btn-hover-shadow, 0 10px 28px rgba(0, 0, 0, 0.15));
        }
        .controls button:active {
            transform: scale(0.96);
        }
        .controls button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
            filter: grayscale(0.3);
        }

        .btn-import {
            background: var(--btn-import, #4a6cf7) !important;
            color: #fff !important;
        }
        .btn-clear {
            background: var(--btn-clear, #e74c6f) !important;
            color: #fff !important;
        }
        .btn-start {
            background: var(--btn-start, #2ecc71) !important;
            color: #fff !important;
        }
        .btn-stop {
            background: var(--btn-stop, #f39c12) !important;
            color: #fff !important;
        }

        /* ===== 示例按钮 ===== */
        .controls-bottom {
            display: flex;
            justify-content: center;
            margin-top: 0px;
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
        }

        .btn-local {
            padding: 8px 28px;
            font-size: 0.85rem;
            font-weight: 500;
            border: none;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary, #888);
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: var(--btn-shadow, 0 2px 8px rgba(0, 0, 0, 0.03));
        }

        .btn-local:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary, #444);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .btn-local:active {
            transform: scale(0.96);
        }

        /* ===== 底部 ===== */
        .footer-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-top: 10px;
            padding-top: 14px;
            border-top: 1px solid var(--border-light, rgba(0, 0, 0, 0.06));
            position: relative;
            z-index: 2;
        }

        .col-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }

        .col-selector select {
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid var(--border-light, #ccc);
            background: var(--select-bg, #f8fafc);
            color: var(--text-primary, #222);
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            min-width: 110px;
        }

        .theme-toggle-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .theme-toggle-area .label {
            font-size: 0.75rem;
            opacity: 0.5;
            letter-spacing: 1px;
        }

        .theme-btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .theme-btn {
            padding: 5px 12px;
            border-radius: 40px;
            border: 1px solid var(--border-light, #ddd);
            background: var(--btn-bg, #f0f2f5);
            color: var(--text-primary, #222);
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .theme-btn:hover {
            background: var(--btn-hover, #d0d7e2);
            transform: scale(1.05);
        }

        .theme-btn.active {
            background: var(--theme-active, #00d4ff);
            color: #fff;
            border-color: var(--theme-active, #00d4ff);
            box-shadow: 0 4px 14px rgba(0, 212, 255, 0.3);
        }

        #fileInput {
            display: none;
        }

        /* ================================================================
           4种主题
           ================================================================ */

        /* ---------- 1. 霓虹灯 (Neon) ---------- */
        html[data-theme="neon"] {
            --bg-body: #0a0a12;
            --bg-container: rgba(10, 10, 20, 0.7);
            --blur-container: blur(4px);
            --radius-container: 24px;
            --shadow-container: 0 0 60px rgba(0, 255, 255, 0.08);
            --border-container: 1px solid rgba(0, 255, 255, 0.2);
            --text-primary: #ccf4ff;
            --text-secondary: #7fc8d9;
            --text-main: #b0f0ff;
            --text-glow: 0 0 20px #0ff, 0 0 60px #0ff, 0 0 100px #0ff;
            --radius-card: 12px;
            --side-bg: rgba(0, 255, 255, 0.04);
            --btn-bg: rgba(0, 255, 255, 0.06);
            --btn-shadow: 0 0 20px rgba(0, 255, 255, 0.06);
            --btn-blur: none;
            --btn-border: 1px solid rgba(0, 255, 255, 0.2);
            --btn-hover-shadow: 0 0 40px rgba(0, 255, 255, 0.15);
            --border-light: rgba(0, 255, 255, 0.15);
            --select-bg: rgba(0, 20, 30, 0.7);
            --btn-import: #00d4ff;
            --btn-clear: #ff3b7f;
            --btn-start: #39ff9e;
            --btn-stop: #ffb347;
            --theme-active: #00d4ff;
            --main-bg: rgba(0, 255, 255, 0.02);
            --main-blur: none;
            --main-border: 1px solid rgba(0, 255, 255, 0.08);
            --main-shadow: 0 0 80px rgba(0, 255, 255, 0.03);
            --main-transform: scale(1.02);
        }

        /* ---------- 2. 渐变色 (Gradient) ---------- */
        html[data-theme="gradient"] {
            --bg-body: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a1c4fd, #c2e9fb);
            --bg-container: rgba(255, 255, 255, 0.35);
            --blur-container: blur(12px);
            --radius-container: 40px;
            --shadow-container: 0 20px 60px rgba(0, 0, 0, 0.06);
            --border-container: 1px solid rgba(255, 255, 255, 0.25);
            --text-primary: #2d2a3e;
            --text-secondary: #5a5578;
            --text-main: #1f1b33;
            --text-glow: none;
            --radius-card: 24px;
            --side-bg: rgba(255, 255, 255, 0.12);
            --btn-bg: rgba(255, 255, 255, 0.25);
            --btn-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            --btn-blur: blur(6px);
            --btn-border: 1px solid rgba(255, 255, 255, 0.2);
            --btn-hover-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            --border-light: rgba(255, 255, 255, 0.15);
            --select-bg: rgba(255, 255, 255, 0.2);
            --btn-import: #6c5b9e;
            --btn-clear: #c94f6f;
            --btn-start: #3c9b7a;
            --btn-stop: #d48c2c;
            --theme-active: #6c5b9e;
            --main-bg: rgba(255, 255, 255, 0.06);
            --main-blur: blur(4px);
            --main-border: 1px solid rgba(255, 255, 255, 0.08);
            --main-shadow: 0 8px 32px rgba(0, 0, 0, 0.02);
        }

        /* ---------- 3. 孟菲斯 (Memphis) ---------- */
        html[data-theme="memphis"] {
            --bg-body: #fdeff2;
            --bg-container: #ffffff;
            --blur-container: none;
            --radius-container: 8px;
            --shadow-container: 12px 12px 0 #ff6b6b, 24px 24px 0 #feca57;
            --border-container: 4px solid #2d2d2d;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-main: #111;
            --text-glow: none;
            --radius-card: 0px;
            --side-bg: #fff0e6;
            --btn-bg: #fef9e7;
            --btn-shadow: 6px 6px 0 #2d2d2d;
            --btn-blur: none;
            --btn-border: 3px solid #2d2d2d;
            --btn-hover-shadow: 4px 4px 0 #2d2d2d;
            --border-light: #2d2d2d;
            --select-bg: #fff8f0;
            --btn-import: #4a7cf7;
            --btn-clear: #ff4757;
            --btn-start: #2ed573;
            --btn-stop: #ffa502;
            --theme-active: #4a7cf7;
            --main-bg: #f8f4ec;
            --main-blur: none;
            --main-border: 4px solid #2d2d2d;
            --main-shadow: 8px 8px 0 #2d2d2d;
        }

        /* ---------- 4. 粘土 (Clay) ---------- */
        html[data-theme="clay"] {
            --bg-body: #e8e0d8;
            --bg-container: #f0e8e0;
            --blur-container: none;
            --radius-container: 48px;
            --shadow-container: inset 0 -8px 0 #c8b8a8, 0 20px 50px rgba(80, 60, 40, 0.12);
            --border-container: none;
            --text-primary: #4a3a2e;
            --text-secondary: #7a6a5a;
            --text-main: #2d1f14;
            --text-glow: none;
            --radius-card: 32px;
            --side-bg: rgba(200, 180, 160, 0.15);
            --btn-bg: #e8ddd0;
            --btn-shadow: inset 0 -6px 0 #c8b8a8, 0 8px 24px rgba(80, 60, 40, 0.06);
            --btn-blur: none;
            --btn-border: none;
            --btn-hover-shadow: inset 0 -4px 0 #c8b8a8, 0 12px 32px rgba(80, 60, 40, 0.08);
            --border-light: rgba(160, 140, 120, 0.15);
            --select-bg: #e8ddd0;
            --btn-import: #7a8c8c;
            --btn-clear: #b55a6a;
            --btn-start: #5a9a7a;
            --btn-stop: #c88a3a;
            --theme-active: #7a8c8c;
            --main-bg: #f0e8e0;
            --main-blur: none;
            --main-border: none;
            --main-shadow: inset 0 -8px 0 #d0c0b0, 0 12px 40px rgba(80, 60, 40, 0.04);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 920px) {
            .main-name {
                font-size: 6rem;
                min-height: 130px;
                min-width: 200px;
            }
            .display-area {
                min-height: 320px;
            }
            .side-name {
                flex: 0 0 70px;
                font-size: 0.85rem;
            }
            .copyright {
                font-size: 0.6rem;
                top: 4px;
                left: 8px;
                letter-spacing: 1.5px;
            }
            .version-info {
                font-size: 0.5rem;
                bottom: 6px;
                left: 12px;
                padding: 2px 8px;
            }
            .marquee-container {
                top: -12px;
                left: -12px;
                right: -12px;
                bottom: -8px;
            }
            .btn-local {
                font-size: 0.75rem;
                padding: 6px 20px;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 16px 12px;
            }
            .display-area {
                flex-direction: column;
                gap: 4px;
                min-height: auto;
            }
            .side-name {
                flex: 0 0 auto;
                width: 100%;
                font-size: 0.9rem;
                padding: 3px 6px;
                display: flex;
                justify-content: center;
                gap: 16px;
                opacity: 0.45;
            }
            .side-name .label {

    <script>
        // ============================================================
        //  完整核心逻辑 + 走马灯 + 翻页笔控制
        // ============================================================

        (function() {
            'use strict';

            // ---- DOM 引用 ----
            const mainNameEl = document.getElementById('mainName');
            const prevNameText = document.getElementById('prevNameText');
            const nextNameText = document.getElementById('nextNameText');
            const studentCount = document.getElementById('studentCount');
            const importBtn = document.getElementById('importBtn');
            const localBtn = document.getElementById('localBtn');
            const clearBtn = document.getElementById('clearBtn');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const fileInput = document.getElementById('fileInput');
            const colSelect = document.getElementById('colSelect');
            const themeBtns = document.querySelectorAll('.theme-btn');
            const versionInfo = document.getElementById('versionInfo');
            const copyrightBtn = document.getElementById('copyrightBtn');
            const copyrightModal = document.getElementById('copyrightModal');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const marqueeContainer = document.getElementById('marqueeContainer');

            const VERSION = '超级点名器 V1.2';

            function updateVersionInfo() {
                const now = new Date();
                const pad = n => String(n).padStart(2, '0');
                const timestamp =
                    `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
                versionInfo.textContent = `${VERSION} · ${timestamp}`;
            }
            updateVersionInfo();

            // ---- 版权弹窗 ----
            function showModal() { copyrightModal.classList.add('show'); }

            function hideModal() { copyrightModal.classList.remove('show'); }

            copyrightBtn.addEventListener('click', showModal);
            modalCloseBtn.addEventListener('click', hideModal);
            copyrightModal.addEventListener('click', function(e) {
                if (e.target === this) hideModal();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && copyrightModal.classList.contains('show')) hideModal();
            });

            // ============================================================
            //  走马灯系统
            // ============================================================

            const LIGHT_CONFIGS = {
                neon: {
                    count: 24,
                    size: 26,
                    shape: ['circle', 'square'],
                    shapeRatio: 3,
                    colors: ['#00ffff', '#ff00ff', '#ffff00', '#00ff88', '#ff3366', '#8844ff', '#ff8800', '#33ccff'],
                    glowStyle: 'outer',
                    interval: 70,
                    trail: 3,
                    motion: 'steady',
                    specialEffect: 'scale'
                },
                gradient: {
                    count: 20,
                    size: 24,
                    shape: ['droplet'],
                    shapeRatio: 1,
                    colors: 'hsl',
                    glowStyle: 'rainbow',
                    interval: 120,
                    trail: 2,
                    motion: 'wave',
                    specialEffect: 'droplet'
                },
                memphis: {
                    count: 16,
                    size: 30,
                    shape: ['triangle', 'circle'],
                    shapeRatio: 1,
                    colors: ['#FF6B6B', '#FECA57', '#48DBFB', '#FF9FF3', '#54A0FF', '#FF9F43', '#2ED573', '#FF4757'],
                    glowStyle: 'shadow',
                    interval: 150,
                    trail: 1,
                    motion: 'jump',
                    specialEffect: 'bounce'
                },
                clay: {
                    count: 20,
                    size: 28,
                    shape: ['circle'],
                    shapeRatio: 1,
                    colors: ['#E8D5B7', '#D4A574', '#C4B7A6', '#A8B5A0', '#DCC8B0', '#B8A99A', '#E0C9B5', '#C9BBA8'],
                    glowStyle: 'inner',
                    interval: 200,
                    trail: 1,
                    motion: 'breath',
                    specialEffect: 'raise'
                }
            };

            let currentTheme = 'neon';
            let lightElements = [];
            let lightColors = [];
            let lightShapes = [];
            let marqueeTimer = null;
            let activeIndex = 0;
            let isMarqueeRunning = false;
            let waveStep = 0;
            let isFlashing = false;
            let flashTimer = null;
            let autoOffTimer = null;
            let isAutoOffPending = false;

            // ---- 形状生成 ----
            function getShapeCSS(shape, size) {
                switch (shape) {
                    case 'circle':
                        return `border-radius: 50%;`;
                    case 'square':
                        return `border-radius: 3px;`;
                    case 'triangle':
                        return `clip-path: polygon(50% 0%, 0% 100%, 100% 100%); border-radius: 0;`;
                    case 'droplet':
                        return `border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;`;
                    default:
                        return `border-radius: 50%;`;
                }
            }

            // ---- 生成灯的位置 ----
            function generateLightPositions(count) {
                const positions = [];
                const perSide = Math.floor(count / 4);
                const remaining = count % 4;

                const topCount = perSide + (remaining >= 1 ? 1 : 0);
                for (let i = 0; i < topCount; i++) {
                    positions.push({ x: (i + 1) / (topCount + 1), y: 0 });
                }

                const rightCount = perSide + (remaining >= 2 ? 1 : 0);
                for (let i = 0; i < rightCount; i++) {
                    positions.push({ x: 1, y: (i + 1) / (rightCount + 1) });
                }

                const bottomCount = perSide + (remaining >= 3 ? 1 : 0);
                for (let i = 0; i < bottomCount; i++) {
                    positions.push({ x: 1 - (i + 1) / (bottomCount + 1), y: 1 });
                }

                const leftCount = perSide;
                for (let i = 0; i < leftCount; i++) {
                    positions.push({ x: 0, y: 1 - (i + 1) / (leftCount + 1) });
                }

                return positions;
            }

            // ---- 生成颜色 ----
            function generateColors(theme, count) {
                const config = LIGHT_CONFIGS[theme];
                if (config.colors === 'hsl') {
                    return Array.from({ length: count }, (_, i) => {
                        const hue = (i / count) * 360 + 30;
                        return `hsl(${hue}, 80%, 65%)`;
                    });
                }
                const colors = [];
                for (let i = 0; i < count; i++) {
                    colors.push(config.colors[i % config.colors.length]);
                }
                return colors;
            }

            // ---- 生成形状列表 ----
            function generateShapes(theme, count) {
                const config = LIGHT_CONFIGS[theme];
                const shapes = [];
                for (let i = 0; i < count; i++) {
                    if (config.shape.length === 1) {
                        shapes.push(config.shape[0]);
                    } else if (config.shapeRatio === 1) {
                        shapes.push(config.shape[i % config.shape.length]);
                    } else {
                        const cycle = config.shapeRatio + 1;
                        const pos = i % cycle;
                        shapes.push(pos < config.shapeRatio ? config.shape[0] : config.shape[1]);
                    }
                }
                return shapes;
            }

            // ---- 构建走马灯 ----
            function buildMarquee(theme) {
                marqueeContainer.innerHTML = '';
                lightElements = [];
                lightColors = [];
                lightShapes = [];

                const config = LIGHT_CONFIGS[theme];
                const count = config.count;
                const size = config.size || 20;
                const positions = generateLightPositions(count);
                const colors = generateColors(theme, count);
                const shapes = generateShapes(theme, count);

                const offset = Math.ceil(size / 2) + 2;

                positions.forEach((pos, i) => {
                    const light = document.createElement('div');
                    light.className = 'light';

                    const left = pos.x * 100;
                    const top = pos.y * 100;

                    light.style.left = `calc(${left}% + ${pos.x === 0 ? offset : pos.x === 1 ? -offset : 0}px)`;
                    light.style.top = `calc(${top}% + ${pos.y === 0 ? offset : pos.y === 1 ? -offset : 0}px)`;
                    light.style.width = size + 'px';
                    light.style.height = size + 'px';

                    const shapeCSS = getShapeCSS(shapes[i], size);
                    light.style.cssText += shapeCSS;

                    const color = colors[i];
                    light.style.backgroundColor = color;

                    applyGlowStyle(light, theme, color, false);

                    light.dataset.index = i;
                    light.dataset.color = color;
                    light.dataset.shape = shapes[i];

                    marqueeContainer.appendChild(light);
                    lightElements.push(light);
                    lightColors.push(color);
                    lightShapes.push(shapes[i]);
                });

                lightElements.forEach((el) => {
                    el.style.opacity = '0.12';
                    el.style.transform = `translate(-50%, -50%) scale(0.8)`;
                });

                activeIndex = 0;
                isFlashing = false;
                isAutoOffPending = false;
                if (flashTimer) {
                    clearInterval(flashTimer);
                    flashTimer = null;
                }
                if (autoOffTimer) {
                    clearTimeout(autoOffTimer);
                    autoOffTimer = null;
                }
            }

            // ---- 应用发光样式 ----
            function applyGlowStyle(el, theme, color, isActive) {
                const config = LIGHT_CONFIGS[theme];
                const glowStyle = config.glowStyle;

                el.style.boxShadow = 'none';
                el.style.border = 'none';
                el.style.filter = 'none';

                if (isActive) {
                    switch (glowStyle) {
                        case 'outer':
                            el.style.boxShadow = `0 0 30px 14px ${color}, 0 0 70px 30px ${color}44`;
                            el.style.filter = 'brightness(1.3)';
                            break;
                        case 'rainbow':
                            const hue = (parseInt(el.dataset.index) * 15) % 360;
                            el.style.boxShadow =
                                `0 0 25px 12px hsl(${hue}, 90%, 70%), 0 0 55px 22px hsl(${hue+40}, 90%, 60%)44`;
                            el.style.filter = 'brightness(1.2)';
                            break;
                        case 'shadow':
                            el.style.boxShadow = `6px 6px 0 #2d2d2d, 0 0 25px ${color}66`;
                            el.style.border = '2px solid #2d2d2d';
                            break;
                        case 'inner':
                            el.style.boxShadow =
                                `inset 0 -6px 0 rgba(0,0,0,0.15), inset 0 4px 14px rgba(255,255,255,0.4), 0 4px 18px rgba(0,0,0,0.08)`;
                            el.style.filter = 'brightness(1.15)';
                            break;
                        default:
                            el.style.boxShadow = `0 0 25px 10px ${color}88`;
                    }
                } else {
                    if (glowStyle === 'inner') {
                        el.style.boxShadow = `inset 0 -4px 0 rgba(0,0,0,0.08), inset 0 2px 8px rgba(255,255,255,0.2)`;
                    } else {
                        el.style.boxShadow = `0 0 10px 3px ${color}22`;
                    }
                }
            }

            // ---- 走马灯更新 ----
            function updateMarquee() {
                if (isFlashing) return;
                const config = LIGHT_CONFIGS[currentTheme];
                const trail = config.trail || 2;
                const count = lightElements.length;
                if (count === 0) return;

                lightElements.forEach((el, i) => {
                    el.classList.remove('active', 'trail', 'trail2');
                    const color = el.dataset.color;
                    applyGlowStyle(el, currentTheme, color, false);
                    el.style.opacity = '0.12';
                    el.style.transform = `translate(-50%, -50%) scale(0.8)`;
                });

                let idx = activeIndex;
                if (config.motion === 'jump') {
                    idx = activeIndex % count;
                } else if (config.motion === 'wave') {
                    waveStep += 0.3;
                    const wavePos = Math.sin(waveStep) * 0.5 + 0.5;
                    idx = Math.floor(wavePos * count) % count;
                }

                for (let i = 0; i < trail; i++) {
                    const targetIdx = (idx - i + count) % count;
                    const el = lightElements[targetIdx];
                    const color = el.dataset.color;

                    if (i === 0) {
                        el.classList.add('active');
                        applyGlowStyle(el, currentTheme, color, true);
                        el.style.opacity = '1';
                        applySpecialEffect(el, currentTheme, 'active');
                    } else if (i === 1) {
                        el.classList.add('trail');
                        applyGlowStyle(el, currentTheme, color, true);
                        el.style.opacity = '0.55';
                        el.style.transform = `translate(-50%, -50%) scale(0.92)`;
                        if (config.glowStyle !== 'inner') {
                            el.style.boxShadow = el.style.boxShadow.replace(/[0-9]+px/g, m => Math.floor(parseInt(m) * 0.5) +
                            'px');
                        }
                    } else if (i === 2) {
                        el.classList.add('trail2');
                        applyGlowStyle(el, currentTheme, color, false);
                        el.style.opacity = '0.25';
                        el.style.transform = `translate(-50%, -50%) scale(0.85)`;
                    }
                }

                if (config.motion === 'breath') {
                    const breathPhase = (Date.now() % 2000) / 2000;
                    const brightness = Math.sin(breathPhase * Math.PI) * 0.6 + 0.4;
                    lightElements.forEach((el, i) => {
                        if (i === idx) {
                            el.style.opacity = brightness.toString();
                            el.style.transform =
                                `translate(-50%, -50%) scale(${0.9 + brightness * 0.15})`;
                            applyGlowStyle(el, currentTheme, el.dataset.color, true);
                            el.style.boxShadow = el.style.boxShadow.replace(/[0-9]+px/g, m => Math.floor(parseInt(m) *
                                brightness) + 'px');
                        }
                    });
                }

                if (config.motion === 'jump') {
                    activeIndex = (activeIndex + 2) % count;
                } else if (config.motion === 'steady' || config.motion === 'wave' || config.motion === 'breath') {
                    activeIndex = (activeIndex + 1) % count;
                }
            }

            // ---- 特殊效果 ----
            function applySpecialEffect(el, theme, state) {
                const config = LIGHT_CONFIGS[theme];
                const effect = config.specialEffect;

                if (state === 'active') {
                    switch (effect) {
                        case 'scale':
                            el.style.transform = `translate(-50%, -50%) scale(1.3)`;
                            break;
                        case 'droplet':
                            el.style.transform = `translate(-50%, -50%) rotate(45deg) scale(1.2)`;
                            break;
                        case 'bounce':
                            el.style.transform = `translate(-50%, -50%) scale(1.15) translateY(-8px)`;
                            break;
                        case 'raise':
                            el.style.transform = `translate(-50%, -50%) scale(1.1)`;
                            break;
                        default:
                            el.style.transform = `translate(-50%, -50%) scale(1.15)`;
                    }
                }
            }

            // ---- 闪烁5次后常亮 ----
            function flashFiveThenStayOn() {
                if (isFlashing) return;
                if (lightElements.length === 0) return;

                isFlashing = true;
                isAutoOffPending = true;

                if (marqueeTimer) {
                    clearInterval(marqueeTimer);
                    marqueeTimer = null;
                }
                isMarqueeRunning = false;

                if (autoOffTimer) {
                    clearTimeout(autoOffTimer);
                    autoOffTimer = null;
                }

                lightElements.forEach((el) => {
                    el.classList.remove('active', 'trail', 'trail2', 'all-on', 'flash-on', 'flash-off');
                });

                let flashCount = 0;
                const totalFlashes = 10;

                if (flashTimer) {
                    clearInterval(flashTimer);
                    flashTimer = null;
                }

                flashTimer = setInterval(() => {
                    if (flashCount >= totalFlashes) {
                        clearInterval(flashTimer);
                        flashTimer = null;
                        lightElements.forEach((el) => {
                            el.classList.remove('flash-off');
                            const color = el.dataset.color;
                            applyGlowStyle(el, currentTheme, color, true);
                            el.style.opacity = '1';
                            el.style.transform = `translate(-50%, -50%) scale(1.15)`;
                            el.classList.add('all-on');
                        });
                        isFlashing = false;

                        if (autoOffTimer) {
                            clearTimeout(autoOffTimer);
                            autoOffTimer = null;
                        }
                        autoOffTimer = setTimeout(() => {
                            if (!isMarqueeRunning && !isFlashing) {
                                lightElements.forEach((el) => {
                                    el.classList.remove('all-on');
                                    const color = el.dataset.color;
                                    applyGlowStyle(el, currentTheme, color, false);
                                    el.style.opacity = '0.12';
                                    el.style.transform = `translate(-50%, -50%) scale(0.8)`;
                                });
                                isAutoOffPending = false;
                                autoOffTimer = null;
                            }
                        }, 3000);

                        return;
                    }

                    const isOn = flashCount % 2 === 0;
                    lightElements.forEach((el) => {
                        const color = el.dataset.color;
                        if (isOn) {
                            el.classList.remove('flash-off');
                            el.classList.add('flash-on');
                            applyGlowStyle(el, currentTheme, color, true);
                            el.style.opacity = '1';
                            el.style.transform = `translate(-50%, -50%) scale(1.2)`;
                        } else {
                            el.classList.remove('flash-on');
                            el.classList.add('flash-off');
                            el.style.boxShadow = 'none';
                            el.style.filter = 'none';
                            el.style.opacity = '0.05';
                            el.style.transform = `translate(-50%, -50%) scale(0.6)`;
                        }
                    });
                    flashCount++;
                }, 150);
            }

            // ---- 启动走马灯 ----
            function startMarquee() {
                if (isMarqueeRunning) return;
                if (lightElements.length === 0) return;

                if (isFlashing) {
                    if (flashTimer) {
                        clearInterval(flashTimer);
                        flashTimer = null;
                    }
                    isFlashing = false;
                }

                if (autoOffTimer) {
                    clearTimeout(autoOffTimer);
                    autoOffTimer = null;
                }
                isAutoOffPending = false;

                lightElements.forEach((el) => {
                    el.classList.remove('all-on', 'flash-on', 'flash-off', 'active', 'trail', 'trail2');
                    const color = el.dataset.color;
                    applyGlowStyle(el, currentTheme, color, false);
                    el.style.opacity = '0.12';
                    el.style.transform = `translate(-50%, -50%) scale(0.8)`;
                });

                isMarqueeRunning = true;
                activeIndex = 0;
                waveStep = 0;

                if (marqueeTimer) {
                    clearInterval(marqueeTimer);
                    marqueeTimer = null;
                }

                const config = LIGHT_CONFIGS[currentTheme];
                const interval = config.interval || 100;

                marqueeTimer = setInterval(() => {
                    updateMarquee();
                }, interval);

                updateMarquee();
            }

            // ---- 停止走马灯 ----
            function stopMarqueeWithFlash() {
                if (isFlashing) return;
                if (isAutoOffPending) return;

                if (marqueeTimer) {
                    clearInterval(marqueeTimer);
                    marqueeTimer = null;
                }
                isMarqueeRunning = false;
                flashFiveThenStayOn();
            }

            // ---- 重置走马灯 ----
            function resetMarquee() {
                if (marqueeTimer) {
                    clearInterval(marqueeTimer);
                    marqueeTimer = null;
                }
                isMarqueeRunning = false;
                isFlashing = false;
                isAutoOffPending = false;
                if (flashTimer) {
                    clearInterval(flashTimer);
                    flashTimer = null;
                }
                if (autoOffTimer) {
                    clearTimeout(autoOffTimer);
                    autoOffTimer = null;
                }

                lightElements.forEach((el) => {
                    el.classList.remove('active', 'trail', 'trail2', 'all-on', 'flash-on', 'flash-off');
                    const color = el.dataset.color;
                    applyGlowStyle(el, currentTheme, color, false);
                    el.style.opacity = '0.12';
                    el.style.transform = `translate(-50%, -50%) scale(0.8)`;

                    const reader = new FileReader();
                    reader.onload = function(e) {

                            const workbook = XLSX.read(data, { type: 'array' });
                            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                            resolve(XLSX.utils.sheet_to_json(firstSheet));
                        } catch (err) { reject(err); }
                    };
                    reader.onerror = function() { reject(new Error('文件读取失败')); };
                    reader.readAsArrayBuffer(file);
                });
            }
