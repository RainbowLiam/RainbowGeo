<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>学生成绩条管理系统 · 在线试用版 | RainbowGeo（文波地理）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f5d8a'/%3E%3Crect x='11' y='34' width='11' height='19' rx='2' fill='%23ffffff'/%3E%3Crect x='26' y='22' width='11' height='31' rx='2' fill='%23ffffff'/%3E%3Crect x='41' y='12' width='11' height='41' rx='2' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f5f8; --surface:#fff; --ink:#233040; --ink2:#5c6b7d; --ink3:#8a97a8;
  --primary:#2f5d8a; --primary2:#254b71; --primary-soft:#e8eff6; --primary-line:#c6d8e8;
  --accent:#d9913a; --ok:#2e7d5b; --danger:#b3443c; --warn:#b07b24;
  --line:#e1e6ed; --line2:#edf0f4; --radius:10px; --shadow:0 1px 3px rgba(23,43,64,.08);
  --nav-h:56px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
}
button{font-family:inherit}
input,select{font-family:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:16px 18px 80px}

/* ===== 顶栏 ===== */
#topbar{
  position:sticky;top:0;z-index:50;background:#1e3a5c;color:#fff;
  display:flex;align-items:center;gap:18px;padding:0 18px;min-height:var(--nav-h);
  box-shadow:0 2px 8px rgba(16,34,54,.18);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex-shrink:0}
.brand svg{flex-shrink:0}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.brand-sub{font-size:11px;color:#b9c9db;white-space:nowrap}
.steps{display:flex;align-items:center;gap:6px;flex:1;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{
  display:flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#cdd9e6;
  border-radius:999px;padding:6px 14px 6px 8px;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .15s;
}
.step .step-no{
  width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0;
}
.step:hover{border-color:rgba(255,255,255,.5);color:#fff}
.step.active{background:#fff;color:var(--primary2);border-color:#fff;font-weight:600}
.step.active .step-no{background:var(--primary);color:#fff}
.step.done{background:rgba(255,255,255,.08)}
.step.disabled{opacity:.45;cursor:not-allowed}
.top-tools{flex-shrink:0;display:flex;align-items:center;gap:8px}
.saved-hint{font-size:11px;color:#9fb4c9;white-space:nowrap}

/* ===== 面板 ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.panel-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel-title .bar{width:4px;height:16px;border-radius:2px;background:var(--primary)}
.panel-desc{color:var(--ink2);font-size:13px}
.hint{color:var(--ink3);font-size:12.5px}
h2.view-title{font-size:18px;margin:4px 0 4px;display:flex;align-items:center;gap:8px}
h2.view-title .bar{width:5px;height:18px;border-radius:2px;background:var(--primary)}
.view-sub{color:var(--ink2);font-size:13px;margin:0 0 14px}

/* ===== 按钮 ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid transparent;
  padding:8px 16px;font-size:13.5px;cursor:pointer;background:#fff;color:var(--ink);transition:all .15s;white-space:nowrap;
}
.btn.primary{background:var(--primary);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--primary2)}
.btn.ghost{border-color:var(--line);color:var(--ink2);background:#fff}
.btn.ghost:hover{border-color:var(--primary-line);color:var(--primary)}
.btn.warn{background:var(--accent);color:#fff;font-weight:600}
.btn.warn:hover{filter:brightness(1.06)}
.btn.danger{background:#fff;border-color:#e2c3c0;color:var(--danger)}
.btn.danger:hover{background:#f9efee}
.btn.small{padding:4px 10px;font-size:12.5px;border-radius:7px}
.btn.lg{padding:10px 22px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ico{width:26px;height:26px;padding:0;border-radius:6px;font-size:15px;line-height:1}

/* ===== 表单 ===== */
.f-label{display:block;font-size:12.5px;color:var(--ink2);margin:0 0 4px}
.inp,.sel{
  height:34px;border:1px solid #d3dae3;border-radius:8px;padding:0 10px;font-size:13.5px;width:100%;
  background:#fff;color:var(--ink);outline:none;transition:border .15s;
}
.inp:focus,.sel:focus{border-color:var(--primary)}
.inp.num{width:90px}
.inp.small{height:30px;font-size:13px}
.sel{appearance:auto}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.form-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13.5px;user-select:none;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:#fbfcfd}
.chk:hover{border-color:var(--primary-line)}
.chk input{accent-color:var(--primary);width:15px;height:15px}
.chk.off{opacity:.55}
.radio{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:#fbfcfd}
.radio input{accent-color:var(--primary)}

/* ===== 标签 / 徽章 ===== */
.chip{display:inline-flex;align-items:center;gap:4px;background:#eef3f8;border:1px solid #dbe6f0;color:var(--primary2);border-radius:999px;padding:2px 9px;font-size:12px}
.chip.ok{background:#eaf4ee;border-color:#cfe6d8;color:var(--ok)}
.chip.warn{background:#fdf3e3;border-color:#f0ddb8;color:var(--warn)}
.chip.danger{background:#fbeceb;border-color:#f0d0ce;color:var(--danger)}
.chip.plain{background:#f4f6f9;border-color:var(--line);color:var(--ink2)}
.tag{display:inline-block;background:var(--primary-soft);color:var(--primary2);border-radius:6px;padding:1px 7px;font-size:11.5px;margin-right:5px}
.tag.dim{background:#f1f3f6;color:var(--ink3)}
.tag.ok{background:#eaf4ee;color:var(--ok)}
.tag.danger{background:#fbeceb;color:var(--danger)}

/* ===== 表格 ===== */
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
.data-table{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff;font-size:13px}
.data-table th,.data-table td{border-bottom:1px solid var(--line2);padding:7px 10px;text-align:left;vertical-align:middle;word-break:break-all}
.data-table thead th{background:#f2f5f9;color:#4a5868;font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line);white-space:nowrap}
.data-table tbody tr:hover{background:#f8fafc}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table td.num,.data-table th.num{text-align:center}

/* ===== 上传 ===== */
.dropzone{
  border:2px dashed #c4cfdb;border-radius:12px;background:#fafbfd;padding:30px 16px;text-align:center;cursor:pointer;transition:all .15s;color:var(--ink2);
}
.dropzone:hover,.dropzone.over{border-color:var(--primary);background:var(--primary-soft);color:var(--primary2)}
.dropzone .dz-icon{width:44px;height:44px;border-radius:12px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:var(--primary)}
.dropzone b{color:var(--ink);font-size:14.5px}
.file-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fbfcfd;margin-top:8px}
.file-item .fname{font-weight:600;word-break:break-all}

/* ===== 步骤操作条 ===== */
.actionbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:6px;flex-wrap:wrap}
.actionbar .left{margin-right:auto}

/* ===== 列识别 ===== */
.col-check{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:10px}
.col-check table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12.5px;background:#fff}
.col-check th,.col-check td{border-bottom:1px solid var(--line2);padding:6px 8px;text-align:left}
.col-check th{background:#f5f7fa;font-size:12px;color:var(--ink2)}
.col-check .sel{height:28px;font-size:12px;padding:0 6px;width:100%}
.col-check .col-sample{color:var(--ink3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== 折叠 ===== */
.collapse-head{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;color:var(--primary);font-size:12.5px}
.collapse-head .caret{transition:transform .15s;display:inline-block}
.collapse-head.open .caret{transform:rotate(90deg)}

/* ===== 考试条目 ===== */
.exam-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fbfcfd}
.exam-item.off{opacity:.6}
.exam-item .e-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.exam-item .e-name{flex:1;min-width:180px}
.exam-item .e-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.exam-item .e-actions{display:flex;gap:6px;margin-left:auto}

/* ===== Tabs ===== */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:transparent;padding:8px 16px;font-size:13.5px;cursor:pointer;color:var(--ink2);border-radius:8px 8px 0 0;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--primary)}
.tab.active{color:var(--primary);border-color:var(--primary) transparent;border-bottom-color:var(--primary);font-weight:600;background:#fff}

/* ===== 对比表 ===== */
.cmp-cell{text-align:center}
.cmp-cell .rk{font-weight:700}
.cmp-cell .sc{color:var(--ink3);font-size:11.5px}
.cmp-best{color:var(--ok);font-weight:700}
.cmp-miss{color:#c3ccd6}
.chart-box{width:100%;height:260px;margin-top:6px}
.chart-fallback{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink3);font-size:13px;border:1px dashed var(--line);border-radius:9px}

/* ===== 格式编辑 ===== */
.grid2{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:16px;align-items:start}
.fgroup{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#fbfcfd}
.fgroup legend{font-size:13px;font-weight:600;color:var(--primary2);padding:0 6px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line2)}
.switch-row:last-child{border-bottom:none}
.switch-row .sw-label{font-size:13.5px}
.switch-row .sw-label small{color:var(--ink3);font-size:11.5px;display:block}
.toggle{position:relative;width:38px;height:21px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle .tk{position:absolute;inset:0;background:#cfd7e1;border-radius:999px;transition:background .15s;cursor:pointer}
.toggle .tk:before{content:"";position:absolute;width:17px;height:17px;left:2px;top:2px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked + .tk{background:var(--primary)}
.toggle input:checked + .tk:before{transform:translateX(17px)}
.toggle input:disabled + .tk{background:#e3e8ee;cursor:not-allowed}

/* ===== 成绩条卡片 ===== */
.gcard{border:1px solid #c9d2dd;border-radius:6px;padding:8px 10px;background:#fff}
.gcard .gtitle{text-align:center;font-weight:700;letter-spacing:2px;margin:0 0 6px}
.gcard .ginfo{display:flex;flex-wrap:wrap;gap:4px 18px;margin-bottom:6px;font-size:12.5px}
.gcard table{width:100%;border-collapse:collapse;table-layout:fixed}
.gcard th,.gcard td{border:1px solid #9aa8b8;padding:3px 4px;text-align:center;font-size:12px;line-height:1.5}
.gcard thead th{background:#eef2f7;font-weight:600}
.gcard tbody tr.gz{background:#f7f9fb}
.gcard .gdim{color:#6a7684;font-size:10.5px}
.gcard .ghead{background:#eef2f7;font-weight:600}
.gcard .gempty{color:#b6c0cb}

/* ===== 打印页 ===== */
.print-layout{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.print-stage{overflow:auto;padding:12px 4px;background:#e8ebf0;border-radius:10px;min-height:520px;max-height:calc(100vh - 120px)}
.sheet-wrap{display:flex;justify-content:center;margin-bottom:18px}
.sheet{background:#fff;box-shadow:0 2px 10px rgba(23,43,64,.16);position:relative;padding:0}
.sheet .pg-head{text-align:center;font-size:12px;color:#333;font-weight:600;margin-bottom:6px}
.page-label{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:11px;color:#7c8896}
.sheet .gcard{margin-bottom:var(--gap,3mm);border-radius:4px}
.sheet .gcard:last-child{margin-bottom:0}
.pg-info{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.warn-line{color:var(--danger);font-size:12.5px;margin-top:6px}
.ok-line{color:var(--ok);font-size:12.5px;margin-top:6px}

/* ===== Toast ===== */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:999;background:#233040;color:#fff;
  padding:10px 18px;border-radius:999px;font-size:13.5px;box-shadow:0 4px 14px rgba(0,0,0,.22);max-width:86vw;opacity:0;transition:opacity .2s;
}
.toast.show{opacity:1}
.toast.err{background:var(--danger)}
.toast.ok{background:var(--ok)}

/* ===== 打印 ===== */
@media print{
  body.printing #topbar,body.printing .print-controls,body.printing .print-actions,body.printing .pg-info,body.printing .page-label{display:none !important}
  body.printing .wrap{padding:0;max-width:none}
  body.printing .print-stage{overflow:visible;background:#fff;border-radius:0;max-height:none;padding:0}
  body.printing .sheet-wrap{zoom:1 !important;margin:0 !important;justify-content:flex-start}
  body.printing .sheet{box-shadow:none;margin:0 !important}
  body.printing .sheet{page-break-after:always}
  body.printing .sheet:last-child{page-break-after:auto}
  body.printing .gcard{border-color:#000}
  body.printing .gcard th,body.printing .gcard td{border-color:#000}
}

/* ===== 响应式 ===== */
@media (max-width:1020px){
  .grid2{grid-template-columns:1fr}
  .print-layout{grid-template-columns:1fr}
  .print-stage{max-height:none}
}
@media (max-width:760px){
  #topbar{flex-wrap:wrap;padding:8px 12px;gap:8px}
  .brand-sub{display:none}
  .steps{order:3;width:100%;flex-basis:100%}
  .brand-name{font-size:13.5px}
  .wrap{padding:12px 10px 70px}
  .step{padding:5px 10px 5px 6px;font-size:13px}
  .form-grid{grid-template-columns:1fr 1fr}
  body{font-size:15px}
  .view-sub{font-size:13.5px}
  input.inp,select.sel,textarea{font-size:16px}
}
@media (max-width:480px){
  .form-grid{grid-template-columns:1fr}
}
.app-footer{text-align:center;padding:14px 12px 26px;font-size:12px;color:#8a94a6;letter-spacing:.5px}
body.printing .app-footer{display:none}
</style>

<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#ffffff" opacity=".14"/><rect x="11" y="34" width="11" height="19" rx="2" fill="#fff"/><rect x="26" y="22" width="11" height="31" rx="2" fill="#fff"/><rect x="41" y="12" width="11" height="41" rx="2" fill="#fff"/></svg>
      <div>
        <div class="brand-name">学生成绩条管理系统</div>
        <div class="brand-sub">多场考试成绩关联 · 成绩条排版 · Word 导出打印</div>
      </div>
    </div>
    <nav class="steps" id="steps" aria-label="流程步骤"></nav>
    <div class="top-tools">
      <span class="saved-hint" id="savedHint">进度自动保存在本机</span>
      <button class="btn small" style="border-color:rgba(255,255,255,.25);color:#dfe9f3;background:transparent" onclick="App.resetAll()">清空数据</button>
    </div>
  </header>
  <main id="main" class="wrap"></main>
  <footer class="app-footer">© RainbowGeo · 超级成绩管理器 v1.0</footer>
</div>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
/* =========================================================
   学生成绩条管理系统 —— 单文件应用
   数据流：导入 Excel → 识别(姓名/科目/排名/总分/折后) → 名单确认
          → 考试确认 → 成绩对比 → 格式编辑 → 打印/导出 Word
   ========================================================= */

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, type){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (type === 'error' ? ' err' : type === 'ok' ? ' ok' : '');
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = 'toast'; t.hidden = true; }, 2600);
}
function fmtNum(v){
  if (v === null || v === undefined || v === '' || isNaN(v)) return '—';
  const n = Number(v);
  if (!isFinite(n)) return '—';
  return String(Math.round(n * 100) / 100);
}
function toNum(v){
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).replace(/[,\s]/g, '').replace(/[第名位次]/g, '').replace(/分$/, '').replace(/[（）()]/g, '');
  if (!s) return null;
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
function avg(arr){ const a = arr.filter(v => v !== null && v !== undefined && !isNaN(v)); return a.length ? a.reduce((x,y)=>x+y,0)/a.length : null; }
function maxV(arr){ const a = arr.filter(v => v !== null && v !== undefined && !isNaN(v)); return a.length ? Math.max(...a) : null; }
function minV(arr){ const a = arr.filter(v => v !== null && v !== undefined && !isNaN(v)); return a.length ? Math.min(...a) : null; }
let __uid = 1;
const uid = () => 'e' + (__uid++);
const mm2px = v => v * 96 / 25.4;
const px2mm = v => v * 25.4 / 96;

/* ---------- 默认配置 ---------- */
const DEFAULT_FORMAT = {
  cardTitle: '学生成绩通知单',
  showCardTitle: true,
  showName: true,
  showCls: true,
  showSid: false,
  showExamCol: true,
  examLabel: '考试',
  subjects: {},
  subjMode: 'both',      // score | rank | both | split
  showTotal: true,
  showTotalRank: true,
  showDisc: true,
  showDiscRank: true,
  showClassRank: true,
  fontSize: 11,
  titleFontSize: 14,
  headerBg: '#eef2f7',
  zebra: false,
  border: true
};
const DEFAULT_PRINT = {
  pagePreset: 'A4',
  customSize: false,
  pageW: 210, pageH: 297,   // mm
  orient: 'portrait',
  marginT: 15, marginB: 12, marginL: 12, marginR: 12,  // mm
  gap: 3,                   // mm，成绩条间距
  perPage: 0,               // 0 = 自动
  fontScale: 100,           // %
  pageHeader: false,
  pageHeaderText: ''
};
const PAGE_PRESETS = { 'A4': [210,297], 'A5': [148,210], 'B5': [176,250], '16K': [195,270], '自定义': [0,0] };

/* ---------- 状态 ---------- */
const DEFAULT_STATE = {

/* ---------- Excel 表头识别 ---------- */
const SUBJECTS = ['语文','数学','英语','外语','日语','俄语','德语','法语','西班牙语','物理','化学','生物','政治','思想政治','思政','道法','道德与法治','历史','地理','科学','信息技术','信息','通用技术','技术','体育','体育与健康','音乐','美术','心理健康','心理','综合','综合实践','劳动','书法','文综','理综','文科综合','理科综合','语数英','听说','物理化学生物'];
function cleanSubj(h){
  return String(h).replace(/[（(].*?[)）]/g, '').replace(/成绩$|得分$|分数$|分$/, '').trim();
}
function classifyHeader(raw){
  let h = String(raw == null ? '' : raw).trim();
  if (!h) return null;
  if (/^序号$/.test(h)) return 'ignore';
  if (/姓名|名字|学生/.test(h) && !/排名|名次|位次/.test(h)) return 'name';
  if (/学号|考号|准考证|编号/.test(h)) return 'sid';
  if (/备注|说明|意见|寄语|家长/.test(h)) return 'ignore';
  if (/加分|扣分|附加/.test(h)) return 'ignore';
  if (/平均|均分/.test(h)) return 'ignore';
  const rankMark = /排名|名次|位次|排位/.test(h);
  if (/折/.test(h)){
    if (rankMark) return 'discRank';
    if (/总分|总成绩|成绩|分|合计/.test(h)) return 'disc';
    return 'ignore';
  }
  if (/班级排名|班排名|班级名次|班名次|班内排名/.test(h)) return 'classRank';
  if (/班级|班别|班名/.test(h)) return 'cls';
  const base = cleanSubj(h.replace(/排名|名次|位次|排位$/, ''));
  if (rankMark){
    if (/总分|总成绩|总得分|合计/.test(h)) return 'totalRank';
    if (SUBJECTS.includes(base)) return 'subjRank:' + base;
    return 'totalRank';
  }
  if (/总分|总成绩|总得分|合计/.test(h)) return 'total';
  if (SUBJECTS.includes(base)) return 'subj:' + base;
  return null;
}
function detectHeader(rows){
  let best = null;
  for (let i = 0; i < Math.min(rows.length, 15); i++){
    const r = rows[i];
    if (!r.some(c => String(c == null ? '' : c).trim() !== '')) continue;
    let score = 0, hasName = false, known = 0;
    r.forEach(c => {
      const role = classifyHeader(c);
      if (!role || role === 'ignore') return;
      if (role === 'name'){ hasName = true; score += 12; }
      else { known++; score += role.startsWith('subj') ? 2 : 3; }
    });
    if (hasName && (!best || score > best.score)) best = { i, score };
  }
  if (!best){
    for (let i = 0; i < Math.min(rows.length, 10); i++){
      const r = rows[i];
      if (!r.some(c => String(c == null ? '' : c).trim() !== '')) continue;
      let score = 0;
      r.forEach(c => { const role = classifyHeader(c); if (role && role !== 'ignore') score++; });
      if (!best || score > best.score) best = { i, score };
    }
  }
  return best ? best.i : 0;
}

/* ---------- 工作表解析 ---------- */
function parseSheet(ws, sheetName, fileName, overrides){
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, blankrows: false });
  const rows = aoa.map(r => { const rr = []; for (let i = 0; i < r.length; i++) rr.push(r[i] == null ? '' : String(r[i]).trim()); return rr; });
  const W = rows.length ? Math.max(...rows.map(r => r.length), 0) : 0;
  rows.forEach(r => { while (r.length < W) r.push(''); });
  const hdrIdx = detectHeader(rows);
  const headerRow = rows[hdrIdx];
  const roles = headerRow.map((h, ci) => (overrides && overrides[ci] !== undefined) ? overrides[ci] : classifyHeader(h));
  // 未识别列：数据 ≥60% 为数字时视为科目
  for (let ci = 0; ci < W; ci++){
    if (roles[ci]) continue;
    let num = 0, tot = 0;
    for (let i = hdrIdx + 1; i < rows.length; i++){
      const v = rows[i][ci];
      if (v === '') continue;
      tot++;
      if (toNum(v) !== null) num++;
    }
    if (tot > 0 && num / tot >= 0.6){
      const base = cleanSubj(headerRow[ci]);
      roles[ci] = 'subj:' + (base || headerRow[ci]);
    } else roles[ci] = 'ignore';
  }
  const colOf = role => roles.indexOf(role);
  const subjCol = {}, rankCol = {};
  roles.forEach((r, ci) => {
    if (!r) return;
    if (r.startsWith('subjRank:')) rankCol[r.slice(9)] = ci;
    else if (r.startsWith('subj:')) subjCol[r.slice(5)] = ci;
  });
  const subjects = Object.keys(subjCol);
  const nameCol = colOf('name'), clsCol = colOf('cls'), sidCol = colOf('sid');
  const totalCol = colOf('total'), totalRankCol = colOf('totalRank'), discCol = colOf('disc'), discRankCol = colOf('discRank'), classRankCol = colOf('classRank');
  const students = [];
  let lastName = '';
  for (let i = hdrIdx + 1; i < rows.length; i++){
    const r = rows[i];
    if (!r.some(c => c !== '')) continue;
    const name = (nameCol >= 0 ? r[nameCol] : '') || lastName;
    lastName = name;
    if (!name) continue;
    if (/^(合计|总计|平均|总(分)?统计|汇总)/.test(name)) continue;
    const rec = { name, cls: clsCol >= 0 ? r[clsCol] : '', sid: sidCol >= 0 ? r[sidCol] : '', scores: {}, ranks: {}, total: null, totalRank: null, disc: null, discRank: null, classRank: null };
    subjects.forEach(s => {
      rec.scores[s] = toNum(subjCol[s] >= 0 ? r[subjCol[s]] : '');
      if (rankCol[s] !== undefined) rec.ranks[s] = toNum(rankCol[s] >= 0 ? r[rankCol[s]] : '');
    });
    if (totalCol >= 0) rec.total = toNum(r[totalCol]);
    if (totalRankCol >= 0) rec.totalRank = toNum(r[totalRankCol]);
    if (discCol >= 0) rec.disc = toNum(r[discCol]);
    if (discRankCol >= 0) rec.discRank = toNum(r[discRankCol]);
    if (classRankCol >= 0) rec.classRank = toNum(r[classRankCol]);
    students.push(rec);
  }
  // 表名建议：表头上一行第一个非空长文本（如考试标题）
  let suggest = '';
  if (hdrIdx > 0){
    const t = String(rows[hdrIdx - 1].find(c => String(c == null ? '' : c).trim() !== '') || '').trim();
    if (t && t.length >= 2 && t.length <= 40 && !/姓名|科目|成绩|排名/.test(t)) suggest = t;
  }
  const colPreview = headerRow.map((h, ci) => ({ header: h, role: roles[ci], sample: hdrIdx + 1 < rows.length ? rows[hdrIdx + 1][ci] : '' }));
  return {
    id: uid(), file: fileName, sheetName, examName: suggest || sheetName, suggestName: suggest,
    include: true,
    rawRows: rows, hdrIdx, roles, colOverrides: Object.assign({}, overrides || {}),
    subjects, subjCol, rankCol,
    hasCls: clsCol >= 0, hasSid: sidCol >= 0,
    hasTotal: totalCol >= 0, hasTotalRank: totalRankCol >= 0,
    hasDisc: discCol >= 0, hasDiscRank: discRankCol >= 0, hasClassRank: classRankCol >= 0,
    colPreview, students, byKey: {}
  };
}

/* ---------- 名单关联 ---------- */
function computeKey(name, cls, exam){
  return (state.joinByNameCls && exam.hasCls && cls) ? (name + '|' + cls) : name;
}
function rebuildStudents(){
  const map = new Map();
  state.exams.forEach(ex => {
    ex.byKey = {};
    ex.students.forEach(rec => {
      let key = computeKey(rec.name, rec.cls, ex);
      let k = key, n = 2;
      while (ex.byKey[k]) k = key + '#' + (n++);
      rec.key = k;
      ex.byKey[k] = rec;
      if (!map.has(k)) map.set(k, { key: k, name: rec.name, cls: rec.cls || '', sid: rec.sid || '', examIds: [] });
      const s = map.get(k);
      if (!s.examIds.includes(ex.id)) s.examIds.push(ex.id);
      if (!s.cls && rec.cls) s.cls = rec.cls;
      if (!s.sid && rec.sid) s.sid = rec.sid;
    });
  });
  state.students = Array.from(map.values()).sort((a, b) => (a.cls || '').localeCompare(b.cls || '', 'zh') || a.name.localeCompare(b.name, 'zh'));
  // 格式中确保新科目默认显示
  unionSubjects().forEach(s => { if (state.format.subjects[s] === undefined) state.format.subjects[s] = true; });
}
function unionSubjects(){
  const list = [];
  state.exams.forEach(ex => ex.subjects.forEach(s => { if (!list.includes(s)) list.push(s); }));
  return list;
}
function includedExams(){ return state.exams.filter(e => e.include); }
function examById(id){ return state.exams.find(e => e.id === id); }

/* ---------- 示例数据（可一键体验全流程，非真实数据） ---------- */
function makeSampleData(){
  const people = [
    { name:'王梓涵', cls:'高一(1)班', sid:'20250101' }, { name:'李思远', cls:'高一(1)班', sid:'20250102' },
    { name:'张雨欣', cls:'高一(1)班', sid:'20250103' }, { name:'陈子墨', cls:'高一(1)班', sid:'20250104' },
    { name:'刘若曦', cls:'高一(1)班', sid:'20250105' }, { name:'赵俊杰', cls:'高一(1)班', sid:'20250106' },
    { name:'孙嘉怡', cls:'高一(1)班', sid:'20250107' }, { name:'周子航', cls:'高一(1)班', sid:'20250108' },
    { name:'吴欣妍', cls:'高一(2)班', sid:'20250201' }, { name:'郑浩然', cls:'高一(2)班', sid:'20250202' },
    { name:'钱思彤', cls:'高一(2)班', sid:'20250203' }, { name:'黄俊豪', cls:'高一(2)班', sid:'20250204' },
    { name:'林可心', cls:'高一(2)班', sid:'20250205' }, { name:'何宇航', cls:'高一(2)班', sid:'20250206' },
    { name:'杨佳琪', cls:'高一(2)班', sid:'20250207' }
  ];
  const ability = {}; // 姓名 -> 各科基础能力
  const subs = ['语文','数学','英语','物理','化学'];
  people.forEach(p => {
    ability[p.name] = {};
    subs.forEach((s, si) => {
      let seed = (p.name.charCodeAt(0) * 7 + si * 13) % 41;
      ability[p.name][s] = 58 + seed + (si % 3) * 6;
    });
  });
  const exams = [
    { name: '第一次月考', withDisc: true, wave: 0 },
    { name: '期中考试', withDisc: true, wave: 1 },
    { name: '第二次月考', withDisc: false, wave: 2 }
  ];
  const absent = { '期中考试': '郑浩然' }; // 演示缺考
  const books = [];
  exams.forEach(ex => {
    const header = ['班级','姓名','学号'];
    subs.forEach(s => header.push(s, s + '排名'));
    header.push('总分', '总分排名');
    if (ex.withDisc) header.push('折后成绩', '折后排名');
    header.push('班级排名');
    const rows = [header];
    const records = people.filter(p => absent[ex.name] !== p.name).map(p => {
      const row = [p.cls, p.name, p.sid];
      const sc = {};
      subs.forEach((s, si) => {
        const noise = ((p.name.charCodeAt(1) + ex.wave * 5 + si * 3) % 9) - 4;
        sc[s] = Math.max(42, Math.min(100, Math.round(ability[p.name][s] + noise + ex.wave * 1.5)));
      });
      subs.forEach(s => row.push(sc[s]));
      const total = subs.reduce((a, s) => a + sc[s], 0);
      const disc = Math.round(total * 0.9 * 10) / 10;
      return { p, sc, total, disc };
    });
    // 各科排名、总排名、折后排名、班级排名
    subs.forEach((s, si) => {
      const sorted = records.slice().sort((a, b) => b.sc[s] - a.sc[s]);
      sorted.forEach((r, idx) => { r['rk' + s] = idx + 1; });
    });
    records.slice().sort((a, b) => b.total - a.total).forEach((r, idx) => r.totalRank = idx + 1);
    if (ex.withDisc) records.slice().sort((a, b) => b.disc - a.disc).forEach((r, idx) => r.discRank = idx + 1);
    records.forEach(r => {
      const clsRecs = records.filter(x => x.p.cls === r.p.cls).sort((a, b) => b.total - a.total);
      r.classRank = clsRecs.indexOf(r) + 1;
    });
    records.forEach(r => {
      const row = [r.p.cls, r.p.name, r.p.sid];
      subs.forEach(s => row.push(r.sc[s], r['rk' + s]));
      row.push(r.total, r.totalRank);
      if (ex.withDisc) row.push(r.disc, r.discRank);
      row.push(r.classRank);
      rows.push(row);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = subs.reduce((a) => a.concat([{ wch: 14 }, { wch: 8 }]), [{ wch: 12 }, { wch: 10 }, { wch: 10 }]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, ex.name);
    const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
    const file = new File([buf], ex.name + '.xlsx', { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    books.push(file);
  });
  return books;
}
function loadSample(){
  if (!window.XLSX){ toast('Excel 解析库未就绪，请稍候或检查网络', 'error'); return; }
  state.exams = [];
  makeSampleData().forEach(f => parseFileObj(f));
  rebuildStudents();
  save();
  render();
  toast('已载入 3 场考试的示例数据（可删除后导入真实文件）', 'ok');
}

/* ---------- 文件导入 ---------- */
function parseFileObj(file){
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      wb.SheetNames.forEach(sn => {
        const ws = wb.Sheets[sn];
        if (!ws || !ws['!ref']) return;
        state.exams.push(parseSheet(ws, sn, file.name, null));
      });
      rebuildStudents();
      save();
      render();
      toast('已导入 ' + file.name + '（' + wb.SheetNames.length + ' 个工作表）', 'ok');
    } catch(err){
      toast('解析失败：' + err.message, 'error');
    }
  };
  reader.onerror = () => toast('文件读取失败', 'error');
  reader.readAsArrayBuffer(file);
}

}

/* ---------- 视图：导入与名单确认 ---------- */
function roleOptionsHtml(selected){
  const subs = unionSubjects();
  let opts = [
    ['name', '姓名'], ['cls', '班级'], ['sid', '学号'], ['total', '总分'],
    ['totalRank', '总排名'], ['disc', '折后成绩'], ['discRank', '折后排名'],
    ['classRank', '班级排名'], ['ignore', '忽略']
  ];
  let html = '';
  opts.forEach(o => html += `<option value="${o[0]}" ${selected === o[0] ? 'selected' : ''}>${o[1]}</option>`);
  html += '<optgroup label="科目">';
  subs.forEach(s => {
    const sv = 'subj:' + s, rv = 'subjRank:' + s;
    html += `<option value="${esc(sv)}" ${selected === sv ? 'selected' : ''}>科目 · ${esc(s)}</option>`;
    html += `<option value="${esc(rv)}" ${selected === rv ? 'selected' : ''}>科目排名 · ${esc(s)}</option>`;
  });
  if (selected && selected.startsWith('subj')){
    const s = selected.slice(selected.indexOf(':') + 1);
    if (!subs.includes(s)) html += `<option value="${esc(selected)}" selected>科目 · ${esc(s)}（自定义）</option>`;
  }
  html += '</optgroup>';
  return html;
}

function bindDrop(){
  const dz = $('#drop');
  if (!dz) return;
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('over'));

  const neu = prompt('为科目「' + old + '」输入新名称：', old);

  const role = cur.startsWith('subjRank:') ? 'subjRank:' + neu.trim() : 'subj:' + neu.trim();
  ex.colOverrides[colIdx] = role;

function reparseWithOverrides(ex){
  const rows = ex.rawRows, hdrIdx = ex.hdrIdx, overrides = ex.colOverrides;
  const headerRow = rows[hdrIdx];
  const roles = headerRow.map((h, ci) => (overrides && overrides[ci] !== undefined) ? overrides[ci] : classifyHeader(h));
  for (let ci = 0; ci < rows[0].length; ci++){
    if (roles[ci]) continue;
    let num = 0, tot = 0;
    for (let i = hdrIdx + 1; i < rows.length; i++){
      const v = rows[i][ci]; if (v === '') continue;
      tot++; if (toNum(v) !== null) num++;
    }
    roles[ci] = (tot > 0 && num / tot >= 0.6) ? 'subj:' + (cleanSubj(headerRow[ci]) || headerRow[ci]) : 'ignore';
  }
  const colOf = role => roles.indexOf(role);
  const subjCol = {}, rankCol = {};
  roles.forEach((r, ci) => {
    if (r && r.startsWith('subjRank:')) rankCol[r.slice(9)] = ci;
    else if (r && r.startsWith('subj:')) subjCol[r.slice(5)] = ci;
  });
  const subjects = Object.keys(subjCol);
  const nameCol = colOf('name'), clsCol = colOf('cls'), sidCol = colOf('sid');
  const totalCol = colOf('total'), totalRankCol = colOf('totalRank'), discCol = colOf('disc'), discRankCol = colOf('discRank'), classRankCol = colOf('classRank');
  const students = [];
  let lastName = '';
  for (let i = hdrIdx + 1; i < rows.length; i++){
    const r = rows[i];
    if (!r.some(c => c !== '')) continue;
    const name = (nameCol >= 0 ? r[nameCol] : '') || lastName;
    lastName = name;
    if (!name) continue;
    if (/^(合计|总计|平均|总(分)?统计|汇总)/.test(name)) continue;
    const rec = { name, cls: clsCol >= 0 ? r[clsCol] : '', sid: sidCol >= 0 ? r[sidCol] : '', scores: {}, ranks: {}, total: null, totalRank: null, disc: null, discRank: null, classRank: null };
    subjects.forEach(s => {
      rec.scores[s] = toNum(subjCol[s] >= 0 ? r[subjCol[s]] : '');
      if (rankCol[s] !== undefined) rec.ranks[s] = toNum(rankCol[s] >= 0 ? r[rankCol[s]] : '');
    });
    if (totalCol >= 0) rec.total = toNum(r[totalCol]);
    if (totalRankCol >= 0) rec.totalRank = toNum(r[totalRankCol]);
    if (discCol >= 0) rec.disc = toNum(r[discCol]);
    if (discRankCol >= 0) rec.discRank = toNum(r[discRankCol]);
    if (classRankCol >= 0) rec.classRank = toNum(r[classRankCol]);
    students.push(rec);
  }
  const colPreview = headerRow.map((h, ci) => ({ header: h, role: roles[ci], sample: hdrIdx + 1 < rows.length ? rows[hdrIdx + 1][ci] : '' }));
  return { roles, subjCol, rankCol, subjects, hasCls: clsCol >= 0, hasSid: sidCol >= 0, hasTotal: totalCol >= 0, hasTotalRank: totalRankCol >= 0, hasDisc: discCol >= 0, hasDiscRank: discRankCol >= 0, hasClassRank: classRankCol >= 0, colPreview, students };
}

let __charts = [];

function buildStats(ex){
  const recs = ex.students.filter(r => r.key && !state.removed[r.key]);
  const st = {};
  unionSubjects().forEach(s => {
    const vals = recs.map(r => r.scores[s]).filter(v => v !== null && v !== undefined);

  });
  const tv = recs.map(r => r.total).filter(v => v !== null && v !== undefined);
  st['$total'] = { avg: avg(tv), max: maxV(tv), min: minV(tv), count: tv.length };
  return st;
}

  const firstW = Math.min(22, Math.max(10, Math.round(100 / (exams.length + 1) * 1.4)));

  body.innerHTML = `

/* ---------- 成绩条卡片渲染（屏幕 px / Word pt 双单位） ---------- */
function buildCardHTML(stu, unit){
  const fmt = state.format, exams = includedExams();
  const subs = unionSubjects().filter(s => fmt.subjects[s]);
  const f = v => unit === 'pt' ? (v * 0.75).toFixed(1) + 'pt' : v + 'px';
  const fs = fmt.fontSize * (state.print.fontScale / 100);
  const tfs = fmt.titleFontSize * (state.print.fontScale / 100);
  const bd = fmt.border ? (unit === 'pt' ? '0.5pt solid #000' : '0.8px solid #93a1b2') : 'none';
  const pad = unit === 'pt' ? '1pt 3pt' : '3px 5px';
  const bg = fmt.headerBg || '#eef2f7';
  let h = `<div class="gcard" style="font-size:${f(fs)};font-family:${unit === 'pt' ? "'宋体',SimSun,serif" : 'inherit'};line-height:1.5">`;
  if (fmt.showCardTitle && fmt.cardTitle) h += `<div class="gtitle" style="font-size:${f(tfs)};margin-bottom:${f(unit==='pt'?2:3)}">${esc(fmt.cardTitle)}</div>`;
  const info = [];
  if (fmt.showName) info.push('姓名：<b>' + esc(stu.name) + '</b>');
  if (fmt.showCls && stu.cls) info.push('班级：' + esc(stu.cls));
  if (fmt.showSid && stu.sid) info.push('学号：' + esc(stu.sid));
  if (info.length) h += '<div class="ginfo" style="margin-bottom:' + f(unit==='pt'?2:3) + '">' + info.join('') + '</div>';
  const cols = [];
  if (fmt.showExamCol) cols.push(fmt.examLabel || '考试');
  subs.forEach(s => { if (fmt.subjMode === 'split'){ cols.push(s); cols.push(s + '排名'); } else cols.push(s); });
  if (fmt.showTotal) cols.push('总分');
  if (fmt.showTotalRank) cols.push('总排名');
  if (fmt.showDisc) cols.push('折后成绩');
  if (fmt.showDiscRank) cols.push('折后排名');
  if (fmt.showClassRank) cols.push('班级排名');
  h += '<table style="border-collapse:collapse;width:100%;table-layout:fixed"><thead><tr>' +
    cols.map(c => '<th style="background:' + bg + ';border:' + bd + ';padding:' + pad + ';font-weight:700">' + esc(c) + '</th>').join('') + '</tr></thead><tbody>';
  exams.forEach((ex, ri) => {
    const rec = ex.byKey[stu.key];
    const trBg = (fmt.zebra && ri % 2) ? 'background:#f4f6f9;' : '';
    let cells = [];
    if (fmt.showExamCol) cells.push('<td style="' + trBg + 'border:' + bd + ';padding:' + pad + ';white-space:nowrap">' + esc(ex.examName) + '</td>');
    subs.forEach(s => {
      const sc = rec ? rec.scores[s] : null, rk = rec ? rec.ranks[s] : null;
      const td = '<td style="' + trBg + 'border:' + bd + ';padding:' + pad + '">';
      if (fmt.subjMode === 'split'){
        cells.push(td + fmtNum(sc) + '</td>');
        cells.push(td + fmtNum(rk) + '</td>');
      } else if (fmt.subjMode === 'rank'){
        cells.push(td + fmtNum(rk) + '</td>');
      } else if (fmt.subjMode === 'both'){
        cells.push(td + (sc != null ? fmtNum(sc) : '—') + (rk != null ? '<span class="gdim" style="font-size:' + f(fs * 0.85) + ';color:#5c6b7d">(' + fmtNum(rk) + ')</span>' : '') + '</td>');
      } else {
        cells.push(td + fmtNum(sc) + '</td>');
      }
    });
    if (fmt.showTotal) cells.push('<td style="' + trBg + 'border:' + bd + ';padding:' + pad + ';font-weight:700">' + (rec ? fmtNum(rec.total) : '—') + '</td>');
    if (fmt.showTotalRank) cells.push('<td style="' + trBg + 'border:' + bd + ';padding:' + pad + '">' + (rec ? fmtNum(rec.totalRank) : '—') + '</td>');
    if (fmt.showDisc) cells.push('<td style="' + trBg + 'border:' + bd + ';padding:' + pad + '">' + (rec ? fmtNum(rec.disc) : '—') + '</td>');
    if (fmt.showDiscRank) cells.push('<td style="' + trBg + 'border:' + bd + ';padding:' + pad + '">' + (rec ? fmtNum(rec.discRank) : '—') + '</td>');
    if (fmt.showClassRank) cells.push('<td style="' + trBg + 'border:' + bd + ';padding:' + pad + '">' + (rec ? fmtNum(rec.classRank) : '—') + '</td>');
    h += '<tr>' + cells.join('') + '</tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

function effectivePerPage(cardHmm){
  const p = state.print;
  const W = p.orient === 'landscape' ? Math.max(p.pageW, p.pageH) : Math.min(p.pageW, p.pageH);
  const H = p.orient === 'landscape' ? Math.min(p.pageW, p.pageH) : Math.max(p.pageW, p.pageH);
  const headerH = p.pageHeader ? 9 : 0;
  const printableH = H - p.marginT - p.marginB - headerH;
  const gap = p.gap;
  if (p.perPage > 0) return { per: p.perPage, printableH, headerH, W, H, autoPer: cardHmm > 0 ? Math.max(1, Math.floor((printableH + gap) / (cardHmm + gap))) : 5 };
  return { per: cardHmm > 0 ? Math.max(1, Math.floor((printableH + gap) / (cardHmm + gap))) : 5, printableH, headerH, W, H, autoPer: 0 };
}

        <div class="pg-info" style="margin-top:12px">
          <span class="tag ok">学生 ${students.length} 人</span>
          <span class="tag">按每页 ${per} 条，共 ${pages.length} 页</span>
          <span class="tag plain">卡片高约 ${cardHmm ? cardHmm.toFixed(1) : '—'} mm</span>
          <span class="tag plain">可打印区 ${printableH.toFixed(0)} mm</span>
        </div>
        ${overflow ? `<div class="warn-line">提示：每页 ${per} 张卡片的总高度超过可打印区，内容可能溢出到下一张。建议减少每页条数，或缩小字号 / 边距。</div>` : ''}
        ${p.perPage === 0 ? `<div class="ok-line">每页条数已按页面高度自动分配（${autoPer} 条/页）。</div>` : ''}
      </div>
    </div>
    <div>
      <div class="print-stage" id="printStage">
        ${pages.map((chunk, pi) => `
        <div class="sheet-wrap" id="sw-${pi}">
          <div class="page-label">第 ${pi + 1} / ${pages.length} 页</div>
          <div class="sheet" style="width:${W}mm;height:${H}mm;padding:${p.marginT}mm ${p.marginR}mm ${p.marginB}mm ${p.marginL}mm;--gap:${gap}mm">
            ${p.pageHeader ? '<div class="pg-head">' + esc(p.pageHeaderText || '成绩条') + '</div>' : ''}
            ${chunk.map(s => buildCardHTML(s, 'px')).join('')}
          </div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
  requestAnimationFrame(() => {
    const stg = document.getElementById('printStage');
    if (!stg) return;
    const avail = stg.clientWidth - 8;
    const z = state._zoom || Math.min(1, avail / mm2px(W));
    document.querySelectorAll('.sheet-wrap').forEach(w => w.style.zoom = z);
    document.getElementById('printStage').scrollLeft = 0;
  });
}
App.setPaper = function(k){
  const p = state.print;
  if (k === '自定义'){ p.customSize = true; }
  else { p.customSize = false; p.pagePreset = k; p.pageW = PAGE_PRESETS[k][0]; p.pageH = PAGE_PRESETS[k][1]; }
  save(); renderPrint();
};
App.setPrint = function(key, v, deb){
  let val = v;
  if (['marginT','marginB','marginL','marginR','gap','perPage','fontScale','pageW','pageH'].includes(key)) val = parseFloat(v) || 0;
  state.print[key] = val;
  save();
  if (deb){ clearTimeout(App._pt); App._pt = setTimeout(renderPrint, 300); }
  else renderPrint();
};
App.setPrintText = function(key, v){ state.print[key] = v; save(); clearTimeout(App._pt); App._pt = setTimeout(renderPrint, 300); };
App.doPrint = function(){
  const p = state.print;
  const W = p.orient === 'landscape' ? Math.max(p.pageW, p.pageH) : Math.min(p.pageW, p.pageH);
  const H = p.orient === 'landscape' ? Math.min(p.pageW, p.pageH) : Math.max(p.pageW, p.pageH);
  let st = document.getElementById('printPageStyle');
  if (!st){ st = document.createElement('style'); st.id = 'printPageStyle'; document.head.appendChild(st); }
  st.textContent = '@page{size:' + W + 'mm ' + H + 'mm;margin:0}';
  document.body.classList.add('printing');
  window.print();
  document.body.classList.remove('printing');
};

/* ---------- 导出 Word（.doc，Word HTML 格式） ---------- */
App.exportWord = function(){
  const p = state.print, fmt = state.format;
  const students = state.students.filter(s => !state.removed[s.key]);
  if (!students.length){ toast('没有可导出的学生', 'error'); return; }
  const mm2pt = v => +(v * 72 / 25.4).toFixed(1);
  const W = p.orient === 'landscape' ? Math.max(p.pageW, p.pageH) : Math.min(p.pageW, p.pageH);
  const H = p.orient === 'landscape' ? Math.min(p.pageW, p.pageH) : Math.max(p.pageW, p.pageH);
  const { per } = effectivePerPage(state.cardHmm);
  const gapPt = mm2pt(p.gap);
  const fsPt = Math.max(7, Math.min(22, fmt.fontSize * (p.fontScale / 100) * 0.75));
  const titlePt = fmt.titleFontSize * (p.fontScale / 100) * 0.75;
  let pagesHtml = '';
  for (let i = 0; i < students.length; i += per){
    const chunk = students.slice(i, i + per);
    pagesHtml += '<div' + (i > 0 ? ' style="page-break-before:always"' : '') + '>';
    if (p.pageHeader) pagesHtml += '<p style="text-align:center;font-weight:bold;margin:0 0 4pt">' + esc(p.pageHeaderText || '成绩条') + '</p>';
    pagesHtml += chunk.map(s => buildCardHTML(s, 'pt')).join('');
    pagesHtml += '</div>';
  }
  const doc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="utf-8">
<title>学生成绩条</title>
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->
<style>
@page WordSection1{size:${mm2pt(W)}pt ${mm2pt(H)}pt;margin:${mm2pt(p.marginT)}pt ${mm2pt(p.marginR)}pt ${mm2pt(p.marginB)}pt ${mm2pt(p.marginL)}pt;}
div.WordSection1{page:WordSection1;}
body{font-family:"宋体",SimSun,serif;font-size:${fsPt.toFixed(1)}pt;}
.gcard{border:0.75pt solid #7a8694;border-radius:2pt;padding:3pt 4pt;margin-bottom:${gapPt}pt;}
.gtitle{text-align:center;font-weight:bold;font-size:${titlePt.toFixed(1)}pt;letter-spacing:2pt;margin:0 0 3pt;}
.ginfo{margin:0 0 3pt;}
table{border-collapse:collapse;width:100%;}
th,td{border:0.5pt solid #000;padding:1pt 2pt;text-align:center;}
th{background:#eef2f7;font-weight:bold;}
.gdim{font-size:${(fsPt * 0.85).toFixed(1)}pt;color:#5c6b7d;}
</style>
</head>
<body><div class="WordSection1">${pagesHtml}</div></body>
</html>`;
  const blob = new Blob(['\ufeff' + doc], { type: 'application/msword;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '成绩条_' + students.length + '人_' + includedExams().map(e => e.examName).join('-') + '.doc';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 600);
  toast('已导出 Word 文件，可用 Word / WPS 打开打印', 'ok');
};

/* ---------- 导出 Excel（.xlsx，总名单 + 每场考试 + 跨考试对比） ---------- */
App.exportExcel = function(){
  if (!window.XLSX){ toast('Excel 解析库未加载，请检查网络后重试', 'error'); return; }
  const students = state.students.filter(s => !state.removed[s.key]);
  const exams = includedExams();
  if (!students.length){ toast('没有可导出的学生', 'error'); return; }
  const safeName = n => (String(n).replace(/[\\\/\?\*\[\]:]/g, '').slice(0, 30)) || 'Sheet';
  const val = v => (v === null || v === undefined) ? '' : v;
  const wb = XLSX.utils.book_new();

  // 1. 总名单
  const roster = [['姓名', '班级', '学号', '参与的考试']];
  students.forEach(s => {
    roster.push([s.name, s.cls, s.sid, exams.filter(e => s.examIds.includes(e.id)).map(e => e.examName).join('、')]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(roster), '总名单');

  // 2. 每场考试一个工作表（该场考试的全部识别成绩）
  exams.forEach(ex => {
    const head = ['姓名', '班级', '学号'];
    ex.subjects.forEach(s => head.push(s + '成绩', s + '排名'));
    if (ex.hasTotal) head.push('总分');
    if (ex.hasTotalRank) head.push('总排名');
    if (ex.hasDisc) head.push('折后成绩');
    if (ex.hasDiscRank) head.push('折后排名');
    if (ex.hasClassRank) head.push('班级排名');
    const rows = [head];
    ex.students.forEach(rec => {
      const row = [rec.name, rec.cls, rec.sid];
      ex.subjects.forEach(s => row.push(val(rec.scores[s]), val(rec.ranks[s])));
      if (ex.hasTotal) row.push(val(rec.total));
      if (ex.hasTotalRank) row.push(val(rec.totalRank));
      if (ex.hasDisc) row.push(val(rec.disc));
      if (ex.hasDiscRank) row.push(val(rec.discRank));
      if (ex.hasClassRank) row.push(val(rec.classRank));
      rows.push(row);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), safeName(ex.examName));
  });

  // 3. 跨考试对比（确认名单学生 × 各考试总分/总排名 + 各科成绩/排名）
  const subs = unionSubjects();
  const head = ['姓名', '班级', '学号', '参与考试数'];
  exams.forEach(ex => {
    if (ex.hasTotal) head.push('总分·' + ex.examName);
    if (ex.hasTotalRank) head.push('总排名·' + ex.examName);
    if (ex.hasDisc) head.push('折后成绩·' + ex.examName);
    if (ex.hasDiscRank) head.push('折后排名·' + ex.examName);
  });
  subs.forEach(s => exams.forEach(ex => head.push(s + '成绩·' + ex.examName, s + '排名·' + ex.examName)));
  const rows = [head];
  students.forEach(stu => {
    const row = [stu.name, stu.cls, stu.sid, stu.examIds.length];
    exams.forEach(ex => {
      const rec = ex.byKey[stu.key];
      if (ex.hasTotal) row.push(rec ? val(rec.total) : '');
      if (ex.hasTotalRank) row.push(rec ? val(rec.totalRank) : '');
      if (ex.hasDisc) row.push(rec ? val(rec.disc) : '');
      if (ex.hasDiscRank) row.push(rec ? val(rec.discRank) : '');
    });
    subs.forEach(s => exams.forEach(ex => {
      const rec = ex.byKey[stu.key];
      row.push(rec ? val(rec.scores[s]) : '', rec ? val(rec.ranks[s]) : '');
    }));
    rows.push(row);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), '跨考试对比');

  const fname = '成绩数据_' + students.length + '人_' + exams.map(e => e.examName).join('-').replace(/[\\\/:*?"<>|]/g, '_') + '.xlsx';
  XLSX.writeFile(wb, fname);
  toast('已导出 Excel 文件（总名单 + 各考试 + 跨考试对比）', 'ok');
};

/* ---------- 导出拼接总表（单页大表：按学生横向拼接全部考试成绩） ---------- */
App.exportMerged = function(){
  if (!window.XLSX){ toast('Excel 解析库未加载，请检查网络后重试', 'error'); return; }
  const students = state.students.filter(s => !state.removed[s.key]);
  const exams = includedExams();
  if (!students.length){ toast('没有可导出的学生', 'error'); return; }
  const val = v => (v === null || v === undefined) ? '' : v;
  const head = ['姓名', '班级', '学号'];
  const cols = []; // {exam, label, get(rec)}
  exams.forEach(ex => {
    const P = ex.examName + '·';
    ex.subjects.forEach(s => {
      cols.push({ exam: ex, label: P + s + '成绩', get: r => r ? val(r.scores[s]) : '' });
      cols.push({ exam: ex, label: P + s + '排名', get: r => r ? val(r.ranks[s]) : '' });
    });
    if (ex.hasTotal) cols.push({ exam: ex, label: P + '总分', get: r => r ? val(r.total) : '' });
    if (ex.hasTotalRank) cols.push({ exam: ex, label: P + '总排名', get: r => r ? val(r.totalRank) : '' });
    if (ex.hasDisc) cols.push({ exam: ex, label: P + '折后成绩', get: r => r ? val(r.disc) : '' });
    if (ex.hasDiscRank) cols.push({ exam: ex, label: P + '折后排名', get: r => r ? val(r.discRank) : '' });
    if (ex.hasClassRank) cols.push({ exam: ex, label: P + '班级排名', get: r => r ? val(r.classRank) : '' });
  });
  cols.forEach(c => head.push(c.label));
  const rows = [head];
  students.forEach(stu => {
    const row = [stu.name, stu.cls, stu.sid];
    cols.forEach(c => row.push(c.get(c.exam.byKey[stu.key])));
    rows.push(row);
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), '拼接总表');
  const fname = '成绩拼接总表_' + students.length + '人_' + exams.map(e => e.examName).join('-').replace(/[\\\/:*?"<>|]/g, '_') + '.xlsx';
  XLSX.writeFile(wb, fname);
  toast('已导出拼接总表（一页，按学生横向拼接全部成绩）', 'ok');
};

/* ---------- 全局渲染与启动 ---------- */
function render(){
  renderTopbar();
  const v = { import: renderImport, exams: renderExams, compare: renderCompare, format: renderFormat, print: renderPrint }[state.route];
  if (v) v();
  const h = $('#savedHint');
  if (h) h.textContent = '已自动保存';
}
function init(){
  loadState();
  const r = (location.hash || '').replace('#', '');
  state.route = STEPS.some(s => s.r === r) ? r : 'import';
  rebuildStudents();
  render();
  loadLibs();
}
init();
