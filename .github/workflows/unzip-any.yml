name: 自动解压任意zip
on: [push]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解压根目录任意zip
        run: |
          if ls *.zip >/dev/null 2>&1; then
            for f in *.zip; do
              unzip -o "$f"
              rm -f "$f"
            done
            echo "已解压并删除zip"
          else
            echo "根目录没有zip文件，跳过"
          fi
      - name: 提交变更
        run: |
          git config user.name "RainbowGeo Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "自动解压（v2.0）"
            git push
          fi
